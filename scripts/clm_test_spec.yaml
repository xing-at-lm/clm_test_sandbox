# CLM acceptance-test product and firmware specification.
# Edit limits and the firmware binary when the product or build changes.

firmware:
  dir: C:\Users\MountainViewLabUser\gitrepos\clm_bin_files\bin_files
  filename: clm_rel_marlow_tile_v1.14.bin

# Pass/fail limits. Each error/stability/PER entry is [low, high] inclusive, then unit.
clm_test_spec:
  target_power: 10          # mW per channel
  wavelength_error: [[-0.2, 0.2], nm]
  power_error: [[-0.2, 0.2], dB]
  power_stability: [[0, 0.15], dB]   # 15 min, and 6 min with MUX dither off, 3-sigma
  PER: [[17, 99], dB]              # minimum PER
