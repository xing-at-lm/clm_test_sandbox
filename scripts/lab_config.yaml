# Hardware addresses and default setpoints for the CLM PER lab.
# Edit this file when the bench changes. Test cells read it through clm_experiments.load_config.

data_dir: C:\Users\MountainViewLabUser\xingpan\testdata
tile_index: 3
test_board_type: EVK # CLM-M, CNT, EVK

# Instruments opened by clm_start_test_station / the GUI "Start test station" button.
# Names must match handlers in clm_experiments._station_handlers().
test_station:
  instruments:
    - testboard
    - tec_thorlab
    - tec_arroyo
    - per_meter
    - per_meter_er100
    - osa

aardvark:
  p0: 2239867798
  io: 2239880394
  p1: 2239789566

two-by-two-coupler:
  'A-OSA': 0
  'B-OSA': 1
  'A-OPM': 2
  'B-OPM': 3

firmware:
  dir: C:\Users\MountainViewLabUser\gitrepos\clm_bin_files\bin_files
  filename: clm_rel_marlow_tile_v1.12.bin

per_meter_port: COM7
per_meter_er100_port: COM5
arroyo_port: COM3
dmm_visa: USB0::0x2A8D::0xB318::MY65070041::INSTR
psu_visa: USB0::0x2A8D::0x1202::MY61007909::INSTR
osa_visa: TCPIP0::169.254.236.114::inst0::INSTR
# Keysight N7745C. Not opened with the test station; the instrument self test opens it.
opm_visa: TCPIP::100.65.87.253::INSTR

thorlabs_sdk: C:\Program Files (x86)\Thorlabs\PTC1\Sample\Thorlabs_PTC1_PythonSDK

tec_thorlab:
  baud: 115200
  timeout: 3
  target_mC: 32000

thermal:
  target_c: 32.0
  interval_s: 15
  kp: 0.1
  ki: 0.001
  kd: 0.0

control:
  dither_period_s: 2
  kp_tpic: 0.3
  kp_ld: 0.3
  kp_voa: 0.3
  amp_t_mux: 3
  alpha_i_ld: 0.5

# Previously collected overnight run, used by the offline plot cell.
overnight_csv: C:\Users\MountainViewLabUser\xingpan\testdata\ch5 overnight per and temp_with fiber and clm case TC at 32C_4-30-2026.csv
